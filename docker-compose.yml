services:
  xray:
    image: ghcr.io/xtls/xray-core:latest
    container_name: xray-vless
    restart: unless-stopped
    network_mode: host
    user: "0:0"
    volumes:
      - ./config:/etc/xray:ro
    environment:
      - TZ=UTC
    cap_add:
      - NET_ADMIN
      - NET_BIND_SERVICE
    command: ["run", "-c", "/etc/xray/config.json"]
